<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrossDash - 2D Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            overflow-x: hidden; /* Prevent horizontal scroll */
            overflow-y: auto; /* Ensure vertical scroll works */
        }
        
        .dashboard-container {
            padding: 20px;
            min-height: 100vh;
        }
        
        .dashboard-title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        
        /* Stage / Board for infinite panning */
        .stage {
            width: 100%;
            height: calc(100vh - 140px);
            background: linear-gradient(180deg, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.01) 100%);
            overflow: hidden;
            position: relative;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .board {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 5000px; /* large area to simulate infinite space */
            height: 5000px;
            transform: translate(-50%, -50%);
            background-image: linear-gradient(transparent 23px, rgba(0,0,0,0.03) 24px), linear-gradient(90deg, transparent 23px, rgba(0,0,0,0.03) 24px);
            background-size: 24px 24px, 24px 24px;
        }
        
        .charts-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .chart-window {
            flex: 1 1 calc(25% - 15px);
            min-width: 300px;
            max-width: 400px;
            height: 350px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .chart-header {
            padding: 12px 16px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        
        .chart-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden; /* Contain canvas interactions */
        }
        
        .chart-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: pan-y; /* Allow vertical scrolling but enable chart interaction */
        }
        
        .chart-canvas:focus {
            outline: 2px solid #007bff;
            outline-offset: 2px;
        }
        
        .chart-footer {
            padding: 8px 16px;
            background-color: #f8f9fa;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .reset-button {
            padding: 2px 8px;
            font-size: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .reset-button:hover {
            background-color: #0056b3;
        }
        
        .loading-message {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 18px;
        }

        .navigation {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .nav-button {
            padding: 10px 20px;
            margin-left: 10px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-button:hover {
            background-color: #0056b3;
        }
    </style>
  </head>
  <body>
    <div class="navigation">
        <a href="../" class="nav-button">3D View</a>
        <a href="./" class="nav-button">2D Dashboard</a>
    </div>

    <div class="dashboard-container">
        <h1 class="dashboard-title">3D Charts Dashboard</h1>

        <!-- Stage is the visible viewport. Board is a very large (effectively infinite) surface that can be panned. -->
        <div class="stage" id="stage">
            <div class="board" id="charts-board">
                <div id="charts-grid" class="charts-grid">
                    <div class="loading-message">Loading charts...</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./vanilla-2d.js"></script>
  </body>
</html>
